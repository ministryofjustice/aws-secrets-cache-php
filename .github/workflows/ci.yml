name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
        - version: 8.2
          sha: 7a4a2928b2e7e1542cfb343b4846b57c68a0d05e58f7e72822317323a630d9e5
        - version: 8.3
          sha: 55cc015bbd930774c9edcdaa0278ec14b46a2f59aecbf85a8c6dbad89193d19b
        - version: 8.4
          sha: af068e577aaaf473344a53254078f6daa8e3d482cd6d6050e6da5786763cc5b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build --build-arg PHP_VERSION=${{ matrix.php.version }} --build-arg PHP_SHA=${{ matrix.php.sha }} test-runner
      - run: echo "::add-matcher::.github/phpcs-problem-matcher.json"
      - run: docker compose run --rm test-runner composer phpcs -- --report=xml
      - if: always()
        run: docker compose run --rm test-runner composer phpstan -- --error-format=github
      - if: always()
        run: docker compose run --rm test-runner composer test

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: "Generate semver tag and release"
        id: semver_tag
        uses: ministryofjustice/opg-github-actions/actions/semver@e8b6e80d440613671b8d6f87b5e52a5363cc974a # v5.0.0
        with:
          create_release: false
          default_bump: ${{ github.event_name == 'workflow_dispatch' && 'none' || 'minor' }}
          prerelease: ${{ github.ref_name == 'main' && 'false' || 'true' }}
