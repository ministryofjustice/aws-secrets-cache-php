name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
        - version: 8.2
          sha: 1a6eef0e6945a01b4baf7e60052f8a839125eabf0c6c79212142f7c9ef8b9f7b
        - version: 8.3
          sha: 2fc86f12b6fa3a7d6cf979c64eef6c8926662cee7689b44017d23c73e78a0150
        - version: 8.4
          sha: 9b82b39a26336318b0d3b0d12c6e21a292115c4223ebece6ce9b3aa8c9f86bd3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker compose build --build-arg PHP_VERSION=${{ matrix.php.version }} --build-arg PHP_SHA=${{ matrix.php.sha }} test-runner
      - run: echo "::add-matcher::.github/phpcs-problem-matcher.json"
      - run: docker compose run --rm test-runner composer phpcs -- --report=xml
      - if: always()
        run: docker compose run --rm test-runner composer phpstan -- --error-format=github
      - if: always()
        run: docker compose run --rm test-runner composer test

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"
      - name: "Generate semver tag and release"
        id: semver_tag
        uses: ministryofjustice/opg-github-actions/actions/semver@722a5f955424aaba01e9ca43d68390cd4048d6e1 # v4.10.2
        with:
          create_release: false
          default_bump: ${{ github.event_name == 'workflow_dispatch' && 'none' || 'minor' }}
          prerelease: ${{ github.ref_name == 'main' && 'false' || 'true' }}
