name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
        - version: 8.2
          sha: 1db421dc4d5b4f44df4b09292f9edc29966496030fba7c51bb34131664fb7349
        - version: 8.3
          sha: a7e67cd11bc8b6d8c893bf36d69a92f56b59c2d8d70015af9e3eff03e199333a
        - version: 8.4
          sha: 17bbc8e655709d42c56e4eb24a9c715105a7e446358dba4d26dc06e514d520ef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build --build-arg PHP_VERSION=${{ matrix.php.version }} --build-arg PHP_SHA=${{ matrix.php.sha }} test-runner
      - run: echo "::add-matcher::.github/phpcs-problem-matcher.json"
      - run: docker compose run --rm test-runner composer phpcs -- --report=xml
      - if: always()
        run: docker compose run --rm test-runner composer phpstan -- --error-format=github
      - if: always()
        run: docker compose run --rm test-runner composer test

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: "Generate semver tag and release"
        id: semver_tag
        uses: ministryofjustice/opg-github-actions/actions/semver@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          create_release: false
          default_bump: ${{ github.event_name == 'workflow_dispatch' && 'none' || 'minor' }}
          prerelease: ${{ github.ref_name == 'main' && 'false' || 'true' }}
